async function dl(name,blob){let d=null;try{if(typeof claude!=='undefined')d=await claude.use('downloads')}catch(e){}
if(d){try{await d.save({filename:name,data:blob});$('#err').textContent=''}catch(e){if(!e||e.code!=='declined')$('#err').textContent='Download failed: '+((e&&(e.message||e.code))||'unknown error')}return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
function svgBlob(){const s=$({d:'#ds',m:'#ms',b:'#bs'}[$('#md').value]||'#ts');return new Blob(['<?xml version="1.0" encoding="UTF-8"?>'+new XMLSerializer().serializeToString(s)],{type:'image/svg+xml;charset=utf-8'})}
const cp=t=>navigator.clipboard?navigator.clipboard.writeText(t).catch(()=>{}):0;
function bind(){const sc=$('#sc'),rr=()=>{$('#sc').innerHTML=drawTree(RES.tree);$('#sd').innerHTML=drawDep(RES);if(RES.mtree)$('#sm').innerHTML=drawTree(RES.mtree,'ms');if(RES.btree)$('#sb').innerHTML=drawTree(RES.btree,'bs',true)};
sc.onclick=e=>{const g=e.target.closest('.nd');if(!g)return;pick(+g.dataset.id)};sc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.nd');if(g){e.preventDefault();pick(+g.dataset.id)}}};
sc.ondblclick=e=>{const g=e.target.closest('.nd');if(g){const n=find(+g.dataset.id);if(n.word===undefined){n.collapsed=!n.collapsed;rr()}}};
function find(id,rt=RES.tree){let r=null;(function f(n){if(n.id===id)r=n;n.children.forEach(f)})(rt);return r}
[['#sm','mtree','#dm'],['#sb','btree','#db']].forEach(([si,tk,di])=>{const sm=$(si);if(!(sm&&RES[tk]))return;const pk=id=>{const n=find(id,RES[tk]);SEL=n;rr();$(di).innerHTML=detail(n);const b=$(di+' #tg');if(b)b.onclick=()=>{n.collapsed=!n.collapsed;rr();$(di).innerHTML=detail(n)}};sm.onclick=e=>{const g=e.target.closest('.nd');if(g)pk(+g.dataset.id)};sm.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const g=e.target.closest('.nd');if(g){e.preventDefault();pk(+g.dataset.id)}}};sm.ondblclick=e=>{const g=e.target.closest('.nd');if(g){const n=find(+g.dataset.id,RES[tk]);if(n.word===undefined){n.collapsed=!n.collapsed;rr()}}}});
function pick(id){const n=find(id);SEL=n;rr();$('#det').innerHTML=detail(n);const b=$('#tg');if(b)b.onclick=()=>{n.collapsed=!n.collapsed;rr();$('#det').innerHTML=detail(n)}}
[sc,$('#sd'),$('#sm'),$('#sb')].filter(Boolean).forEach(el=>{let d=null;el.onpointerdown=e=>{if(e.target.closest('.nd'))return;d={x:e.clientX,y:e.clientY,l:el.scrollLeft,t:el.scrollTop}};el.onpointermove=e=>{if(d){el.scrollLeft=d.l-(e.clientX-d.x);el.scrollTop=d.t-(e.clientY-d.y)}};el.onpointerup=el.onpointerleave=()=>d=null});
$('#zi').onclick=()=>{Z=Math.min(Z*1.2,3);rr()};$('#zo').onclick=()=>{Z=Math.max(Z/1.2,.4);rr()};$('#zr').onclick=()=>{Z=1;rr()};

$('#e2').onclick=()=>{const b=svgBlob(),u=URL.createObjectURL(b),im=new Image(),s=$({d:'#ds',m:'#ms',b:'#bs'}[$('#md').value]||'#ts'),vb=s.viewBox.baseVal;im.onload=()=>{const c=document.createElement('canvas');c.width=vb.width*2;c.height=vb.height*2;const x=c.getContext('2d');x.fillStyle=getComputedStyle(document.body).backgroundColor;x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>dl('syntax-tree.png',b))};im.src=u};

$('#e5').onclick=()=>cp(bra(({m:RES.mtree,b:RES.btree}[$('#md').value]||RES.tree)));$('#e6').onclick=()=>cp($("#exp").textContent);$('#e7').onclick=()=>{const sv=$({d:'#ds',m:'#ms',b:'#bs'}[$('#md').value]||'#ts'),cs=getComputedStyle(document.body),h='<!doctype html><meta charset="utf-8"><title>Syntax report</title><body style="font:16px sans-serif;max-width:900px;margin:24px auto;padding:0 16px;background:'+cs.backgroundColor+';color:'+cs.color+'"><h1>'+esc(RES.sentence)+'</h1><div style="overflow:auto">'+new XMLSerializer().serializeToString(sv)+'</div><h2>Analysis</h2><p>'+esc($('#exp').textContent)+'</p><h2>Bracketed tree</h2><pre>'+esc(bra(RES.tree))+'</pre>';dl('syntax-report.html',new Blob([h],{type:'text/html'}))}}
function run(){const e=$('#err');e.textContent='';try{Z=1;show(parse($('#in').value,$('#lang').value))}catch(x){e.textContent=String(x)}}

function selfTest(){let ok=0,n=0;const t=(c)=>{n++;if(c)ok++};
EX.en.concat(EX.bn).forEach(s=>{try{const r=parse(s,'auto');t(r.warnings.every(w=>!/validation/.test(w))&&r.dependencies.filter(d=>d.rel==='root').length===1)}catch(e){t(false)}});
t(bra(parse('The student reads a book.','en').tree).includes('(NN student)'));t(bra(parse('আমি একটি বই পড়ি।','bn').tree).includes('(PRP আমি)'));t(tokBN('আমি ভাত খাই।').length===4);t(detect('আমি')==='bn'&&detect('I')==='en');t(bra(parse('The cat is not here.','en').tree).includes('(RB not)'));EX.en.concat(EX.bn).forEach(s=>{const q=parse(s,'auto');t(!!q.mtree);t(!!q.btree&&binOK(q.btree))});return ok+'/'+n+' checks passed'}
